[project]
name = "pulse"
version = "0.1.0"
description = "Explainable match intelligence on synthetic football events (Microsoft x Premier League hackathon)"
requires-python = ">=3.11"
dependencies = [
    "agent-framework>=1.19.0",
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "mcp>=1.30.0",
    "numpy>=2.4.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
